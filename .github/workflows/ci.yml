name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer needs tags and history

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AqwCompanion.slnx

      - name: Build
        run: dotnet build AqwCompanion.slnx -c Release --no-restore

      - name: Test
        run: dotnet test AqwCompanion.slnx -c Release --no-build

  # Compiles the installer on every change, so a mistake in installer/Questkeeper.iss shows up here and not when a release is tagged.
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish (win-x64, single-file, self-contained)
        run: >
          dotnet publish src/AqwCompanion.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o out/publish

      - name: Build the installer
        shell: pwsh
        run: |
          Rename-Item out/publish/AqwCompanion.exe Questkeeper.exe
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { Write-Error "ISCC.exe not found at $iscc"; exit 1 }
          & $iscc /DMyAppVersion=0.0.0 installer/Questkeeper.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist/Questkeeper-Setup-v0.0.0.exe")) { Write-Error "The installer was not produced"; exit 1 }
