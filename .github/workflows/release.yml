name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  APP_NAME: AqwCompanion
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer derives the version from this tag

      - name: Validate release tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Error "Tag '$($env:TAG)' is not a valid release tag (expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease)."
            exit 1
          }

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test AqwCompanion.slnx -c Release

      - name: Publish (win-x64, single-file, self-contained)
        run: >
          dotnet publish src/AqwCompanion.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o out/publish

      # --- Code signing placeholder -------------------------------------------------
      # Sign out/publish/${{ env.APP_NAME }}.exe here BEFORE packaging once a signing
      # option is chosen (Azure Trusted Signing, OV/EV certificate, or SignPath).
      # Decide the final product/publisher name first: it is embedded in the certificate.
      # -------------------------------------------------------------------------------

      - name: Package
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          Remove-Item out/publish/*.pdb -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "dist/$($env:APP_NAME)-$($env:TAG)-win-x64.zip"
          Compress-Archive -Path out/publish/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $name = Split-Path $zip -Leaf
          # Write with LF endings and no BOM so `sha256sum -c` works on macOS/Linux.
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/SHA256SUMS.txt'), "$hash  $name`n")

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # pwsh does not glob-expand arguments for native commands, so pass an explicit list.
          $files = Get-ChildItem dist -File | ForEach-Object FullName
          $flags = @()
          if ($env:TAG.Contains('-')) { $flags += '--prerelease' }
          gh release create $env:TAG @files --title $env:TAG --generate-notes @flags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
