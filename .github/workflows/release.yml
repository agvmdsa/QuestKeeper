name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  APP_NAME: Questkeeper
  BUILD_EXE: AqwCompanion
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer derives the version from this tag

      - name: Validate release tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Error "Tag '$($env:TAG)' is not a valid release tag (expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease)."
            exit 1
          }

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test AqwCompanion.slnx -c Release

      - name: Publish (win-x64, single-file, self-contained)
        run: >
          dotnet publish src/AqwCompanion.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o out/publish

      # --- Code signing placeholder -------------------------------------------------
      # Sign out/publish/${{ env.BUILD_EXE }}.exe here BEFORE packaging (it is renamed to the product name while packaging) and the installer once a signing
      # option is chosen (Azure Trusted Signing, OV/EV certificate, or SignPath).
      # Decide the final product/publisher name first: it is embedded in the certificate.
      # -------------------------------------------------------------------------------

      - name: Package the zip
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          Remove-Item out/publish/*.pdb -ErrorAction SilentlyContinue
          # The assembly keeps its first name (the data folder and the single-instance lock use it); the file players see is the product name.
          Rename-Item "out/publish/$($env:BUILD_EXE).exe" "$($env:APP_NAME).exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path out/publish/* -DestinationPath "dist/$($env:APP_NAME)-$($env:TAG)-win-x64.zip"

      # The installer wraps the same published files. It does not contain Npcap (its license forbids redistribution);
      # it checks for it and links to the official download page.
      - name: Build the installer
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { Write-Error "ISCC.exe not found at $iscc"; exit 1 }
          $label = $env:TAG.TrimStart('v')
          $numeric = ($label -split '-')[0]
          & $iscc "/DMyAppVersion=$numeric" "/DMyAppVersionLabel=$label" installer/Questkeeper.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist/Questkeeper-Setup-v$label.exe")) { Write-Error "The installer was not produced"; exit 1 }

      - name: Checksums
        shell: pwsh
        run: |
          # Write with LF endings and no BOM so `sha256sum -c` works on macOS/Linux.
          $lines = Get-ChildItem dist -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/SHA256SUMS.txt'), (($lines -join "`n") + "`n"))

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # pwsh does not glob-expand arguments for native commands, so pass an explicit list.
          $files = Get-ChildItem dist -File | ForEach-Object FullName
          $flags = @()
          if ($env:TAG.Contains('-')) { $flags += '--prerelease' }
          gh release create $env:TAG @files --title $env:TAG --generate-notes @flags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
